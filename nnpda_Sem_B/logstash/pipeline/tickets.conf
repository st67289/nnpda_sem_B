input {
  jdbc {
    id => "tickets-jdbc"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/dbA"
    jdbc_user => "user"
    jdbc_password => "password"
    jdbc_default_timezone => "UTC"
    schedule => "*/5 * * * *"
    tracking_column => "tracking_ts"
    tracking_column_type => "timestamp"
    use_column_value => true
    last_run_metadata_path => "/usr/share/logstash/.logstash_jdbc_last_run_tickets"
    statement => <<-'SQL'
      SELECT
        t.id AS ticket_id,
        t.title,
        t.type,
        t.priority,
        t.state,
        t.project_id,
        t.created_at,
        t.updated_at,
        t.deleted_at,
        p.name AS project_name,
        p.state AS project_state,
        p.owner_id,
        GREATEST(
          COALESCE(t.updated_at, t.created_at, TIMESTAMP 'epoch'),
          COALESCE(p.updated_at, p.created_at, TIMESTAMP 'epoch'),
          COALESCE(t.deleted_at, TIMESTAMP 'epoch')
        ) AS tracking_ts
      FROM tickets t
      JOIN projects p ON p.id = t.project_id
      WHERE GREATEST(
        COALESCE(t.updated_at, t.created_at, TIMESTAMP 'epoch'),
        COALESCE(p.updated_at, p.created_at, TIMESTAMP 'epoch'),
        COALESCE(t.deleted_at, TIMESTAMP 'epoch')
      ) > :sql_last_value
    SQL
  }
}

filter {
  mutate {
    lowercase => ["type", "priority", "state", "project_state"]
  }

  date {
    match => ["created_at", "ISO8601", "YYYY-MM-dd HH:mm:ss", "UNIX"]
    target => "created_at"
    timezone => "UTC"
  }

  date {
    match => ["updated_at", "ISO8601", "YYYY-MM-dd HH:mm:ss", "UNIX"]
    target => "updated_at"
    timezone => "UTC"
  }

  date {
    match => ["deleted_at", "ISO8601", "YYYY-MM-dd HH:mm:ss", "UNIX"]
    target => "deleted_at"
    timezone => "UTC"
    tag_on_failure => []
  }

  ruby {
    code => <<-'RUBY'
      %w[created_at updated_at deleted_at].each do |field|
        next unless event.get(field)
        ts = event.get(field)
        if ts.respond_to?(:time)
          event.set(field, ts.time.utc.iso8601)
        elsif ts.is_a?(Time)
          event.set(field, ts.utc.iso8601)
        end
      end
    RUBY
  }

  ruby {
    code => <<-'RUBY'
      if event.get('deleted_at')
        event.set('[@metadata][action]', 'delete')
      else
        event.set('[@metadata][action]', 'index')
      end
    RUBY
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "tickets"
    document_id => "%{ticket_id}"
    action => "%{[@metadata][action]}"
  }
}