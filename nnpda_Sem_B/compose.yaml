services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dbA
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    depends_on:
      - postgres
      - elasticsearch
    ports:
      - "8080:8080"
    networks:
      - backend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dbA
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - backend

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - backend

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    volumes:
      - ./logstash/pipeline/tickets.conf:/usr/share/logstash/pipeline/tickets.conf:ro
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/dbA
      JDBC_USER: user
      JDBC_PASSWORD: password
      JDBC_DRIVER_LIBRARY: ${JDBC_DRIVER_LIBRARY:-/usr/share/logstash/vendor/jar/jdbc/postgresql.jar}
      JDBC_SCHEDULE: "*/5 * * * *"
      JDBC_STATEMENT: SELECT * FROM tickets
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
    depends_on:
      - postgres
      - elasticsearch
    ports:
      - "5044:5044"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  es_data: